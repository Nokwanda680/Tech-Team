<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Accounts{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; color: #1a1a1a; }
        .card { border: 1px solid #ddd; border-radius: 10px; padding: 32px; }
        h1 { font-size: 1.4rem; margin-bottom: 24px; }
        label { display: block; margin-top: 14px; font-size: 0.9rem; font-weight: 600; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
                border: 1px solid #ccc; border-radius: 6px; }
        button { margin-top: 22px; width: 100%; padding: 10px; border: none; border-radius: 6px;
                 background: #1a1a1a; color: #fff; font-weight: 600; cursor: pointer; }
        .errorlist { color: #c0392b; font-size: 0.85rem; list-style: none; padding: 0; margin: 4px 0 0; }
        .helptext { font-size: 0.75rem; color: #777; }
        .links { margin-top: 18px; font-size: 0.9rem; text-align: center; }
        .links a { color: #1a1a1a; }
    </style>
</head>
<body>
    <div class="card">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
