<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image" href="/front-end/Images/logo.jpg">
    <link rel="stylesheet" href="/front-end/styles_login/signup.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
        }
        .error { color: #ff6b6b; font-size: 0.9em; margin-top: 5px; padding: 8px 12px; background:rgba(255,107,107,0.1); border-radius:6px; border-left:3px solid #ff6b6b; }
        .success { color: #51cf66; font-size: 0.9em; margin-top: 5px; padding: 8px 12px; background:rgba(81,207,102,0.1); border-radius:6px; border-left:3px solid #51cf66; }
        .div{
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .div1{
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }
        .div-outer{
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin-bottom: 21px;
        }
        .div-outer > div {
            flex: 1;
        }
        .signup-section:not(#section1) { display: none; }
    </style>
            
    <title>Landlord SignUp</title>
</head>
<body>
    <nav class="nav-bar">
        <img src="/front-end/Images/logo-removebg-preview.png" height="200">
        <p class="p1">Start Your Journey Here at</p>
        <p class="p2">Find <span>My </span>Vibe</p>
    </nav>
    <br>
    <hr>
    
    <main class="div">
        <div class="div1">
            <p style="text-align: center;">
                <img src="/front-end/Images/Student index.webp" height="210px" width='250px'>
            </p>
        </div>
        <div class="div2">
            <form id="landlordSignupForm">
                <section class="signup-section" id="section1">
                    <h2>Personal Information</h2>
                    <div class="div-outer">
                        <div class="div">
                            <label for="first_name">First Name *</label><br>
                            <input id="first_name" type="text" required><br>
                        </div>
                        <div class="div1">
                            <label for="last_name">Last Name *</label><br>
                            <input id="last_name" type="text" required><br>
                        </div></div>
                    <label for="email">Email *</label><br>
                    <input type="email" id="email" placeholder="landlord@example.com" required><br>
                    
                    <label for="username">Username *</label><br>
                    <input id="username" type="text" required><br>

                    <label for="company_name">Company Name</label><br>
                    <input id="company_name" type="text" placeholder="Your company or property name"><br>

                    <label for="id_number">ID Number</label><br>
                    <input id="id_number" type="text"><br><br>
                    
                    <div class="button">
                        <div class="buttondiv2">
                            <button type="button" class="next" onclick="goToSection(2)">Continue</button>
                        </div>
                    </div>
                    <div id="section1_error" class="error"></div>
                </section>

                <section class="signup-section" id="section2" style="display:none;">
                    <h2>Contact Information</h2>
                    <label for="phone_number">Phone Number *</label><br>
                    <input type="tel" id="phone_number" placeholder="+27 12 345 6789" required><br>
                    
                    <label for="address">Business Address</label><br>
                    <textarea id="address" rows="4" cols="40" placeholder="Enter your business address"></textarea><br>
                    
                    <label for="city">City</label><br>
                    <input type="text" id="city" placeholder="Enter your city"><br><br>
                    
                    <div class="button">
                        <div class="buttondiv1">
                            <button type="button" class="previous" onclick="goToSection(1)">Previous</button>
                        </div>
                        <div class="buttondiv2">
                            <button type="button" class="next" onclick="goToSection(3)">Continue</button>
                        </div>
                    </div>
                    <div id="section2_error" class="error"></div>
                </section>
                <section class="signup-section" id="section3" style="display:none;">
                    <h2>Account Setup</h2>
                    <label for="password1">Password *</label><br>
                    <input type="password" id="password1" minlength="8" required><br>
                    <small>At least 8 characters</small><br>
                    
                    <label for="password2">Confirm Password *</label><br>
                    <input type="password" id="password2" minlength="8" required><br><br>
                    
                    <div class="button">
                        <div class="buttondiv1">
                            <button type="button" class="previous" onclick="goToSection(2)">Previous</button>
                        </div>
                        <div class="buttondiv2">
                            <button type="submit" class="next">Create Account</button>
                        </div>
                    </div>
                    <div id="section3_error" class="error"></div>
                    <div id="section3_success" class="success"></div>
                </section>
            </form>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Find My Vibe. All rights reserved. </p>
    </footer>
    <script src="/front-end/shared/csrf.js"></script>
    <script src="/front-end/shared/password-toggle.js"></script>
    <script src="register.js"></script>
</body>
</html>
