<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find My Vibe - Listings Map</title>
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

    <style>
      :root{
        --orange: #f39200;
        --blue: #2196F3;
        --bg: #0f0f0f;
        --surface: #141414;
        --surface-soft: #1d1d1d;
        --text: #f5f5f5;
        --muted: #a7a7a7;
        --border: rgba(255,255,255,0.08);
        --lime: #00FF00;
      }
        #map{
            height: 500px;
            width:90%;
        }
        .search{
            display: flex;

        }
        .outer-map{
          height:500px;
        }
        .search-bar{
          display: flex;
          max-width: 660px;
          background: #fff;
          border-radius: 50px;
          overflow: hidden;
          box-shadow: 0 24px 60px rgba(0,0,0,0.18);
        }
        .search-bar input{
          flex: 1;
          border: none;
          outline: none;
          padding: 16px 24px;
          font-size: 0.95rem;
          color: #0f0f0f;
          background: transparent;
        }
        .search-bar input::placeholder{
          color: #9a9a9a;
        }
        .search-btn{
          border: none;
          background: var(--orange);
          color: var(--bg);
          padding: 16px 28px;
          font-family: 'Syne', sans-serif;
          font-weight: 700;
          cursor: pointer;
        }
        
    </style>
</head>
<body>
    <script src="map_navigation.js"></script>
    <div class="app">
  <aside class="sidebar">
    <div class="brand"><img src='/front-end/Images/logo_removed2.png'class="brand-mark"><div class="brand-name">Find My Vibe</div></div>
    <nav class="nav">
      <div class="nav-label">Menu</div>
      <a class="nav-item" data-page="dashboard" href="dashboard.html">Dashboard</a>
      <a class="nav-item" data-page="search" href="search-listings.html">Search listings</a>
      <a class="nav-item" data-page="saved" href="saved-homes.html">Saved homes</a>
      <a class="nav-item" data-page="applications" href="applications.html">Applications</a>
      <a class="nav-item active" data-page="Map View" href="listings_map.html"><span class="nav-dot"></span>Map View</a>
      <a class="nav-item" data-page="messages" href="messages.html">Messages<span class="nav-badge">2</span></a>
      <a class="nav-item" data-page="roommates" href="roommate-matches.html">Roommate matches</a>

      <div class="nav-label" style="margin-top:14px;">Account</div>
      <a class="nav-item" data-page="account" href="account.html">Account</a>
      <a class="nav-item" data-page="budget" href="budget-preferences.html">Budget &amp; preferences</a>
      <a class="nav-item" data-page="documents" href="documents.html">Documents</a>
      <a class="nav-item" data-page="settings" href="settings.html">Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="avatar">TM</div>
      <div><div class="sf-name">Thandi M.</div><div class="sf-sub">UCT · 3rd year</div></div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <header class="topbar">
      <span class="topbar-title">Map View</span>
      <div class="topbar-right">

        
        <button class="icon-btn"><i class="ti ti-search" aria-hidden="true"></i></button>
        <button class="icon-btn notif-dot"><i class="ti ti-bell" aria-hidden="true"></i></button>
        <button class="icon-btn"><i class="ti ti-settings" aria-hidden="true"></i></button>
      </div>
    </header>
    <form class="search-bar" id="hero-search-form">
      <input type="text" id="address" placeholder="Enter Adress to search for accommodation">
      <button class="search-btn" type="submit">Search</button>
    </form><br><br>
    <div class="outer-map"><div class='map' id="map"></div></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <div class="search"><br><br><!--
        <input type="text" placeholder="Latitude" id="lat">
        <input type="text" placeholder="Longitude" id="long">-->
        
        
    </div>
    
</body>
